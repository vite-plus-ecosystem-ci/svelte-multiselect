name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          cache: true
          run-install: true

      - name: Lint, format, and type check
        run: vp check

      - name: Svelte type check
        run: |
          vp exec svelte-kit sync
          vpx svelte-check-rs --threshold error
